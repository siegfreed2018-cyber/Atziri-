<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Atziri Danae 💛</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Pantalla inicial para iniciar experiencia y audio -->
  <div id="overlay" class="overlay">
    <div class="overlay-content">
      <p>Toca para iniciar 💛</p>
      <div class="emoji" aria-hidden="true">🌻</div>
    </div>
  </div>

  <!-- Lienzo Canvas 3D para toda la pantalla -->
  <canvas id="canvas"></canvas>

  <!-- Audio de fondo -->
  <audio id="audio" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
